<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포천 영영 글램핑</title>
    <meta name="description" content="포천의 숲과 나무, 산으로 둘러싸인 자연 속 감성 영영 글램핑 ">
    <meta name="keywords" content="포천글램핑,포천힐링,포천여행,포천숙소,포천펜션">
    <!-- Preload critical resources -->
    <link rel="preload" href="styles/common.css" as="style">
    <link rel="preload" href="styles/layout-map.css" as="style">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/layout-map.css">
  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="포천 영영 글램핑" />
  <meta property="og:description" content="애견동반 가능한 포천 영영글램핑입니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/05/13/3qveCOw2jlNU.jpg" />
  <meta property="og:url" content="https://youngyoungglamping.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="포천 영영 글램핑" />
  <meta name="twitter:description" content="애견동반 가능한 포천 영영글램핑입니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/05/13/3qveCOw2jlNU.jpg" />
</head>
<body>

    <section class="page-hero-section">
        <!-- Hero background image -->
        <div class="hero-background">
            <img data-customfield-layout-map-hero-image-0>
        </div>
        <!-- Scroll Down Arrow -->
        <div class="scroll-down-section" onclick="scrollToContent()">
            <span class="scroll-text">Scroll Down</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 10L12 15L17 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </section>

    <main class="layout-map-content-wrapper scroll-target">
        <div class="main-container">

            <!-- Hero content: title and description -->
            <div class="hero-content animate-element">
                <h2 class="hero-title title-with-circle-and-line" data-layout-map-about-title></h2>
                <p class="hero-description" data-layout-map-about-description></p>
            </div>

            <!-- Layout map images (dynamically generated) -->
            <div id="layout-map-content" class="animate-element"></div>

        </div>

        <!-- Full banner closing section -->
        <section class="full-banner animate-element" data-main-banner>
            <div class="closing-property-name" data-closing-property-name></div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/image-with-fallback.js"></script>
    <script src="js/common.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common/scroll-animations.js"></script>
    <script src="js/pages/layout-map.js"></script>

    <!-- Initialize Data Mapper -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const layoutMapMapper = new LayoutMapMapper();
            await layoutMapMapper.initialize();
        });
    </script>

</body>
</html>
